services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: open24
      POSTGRES_USER: open24
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open24 -d open24"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
